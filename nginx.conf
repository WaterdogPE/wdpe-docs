server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text-based assets
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # Long-cache fingerprinted build assets (VitePress hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve VitePress's themed 404 page with a real 404 status code
    error_page 404 /404.html;

    # Clean-URL multipage routing: exact file -> file.html -> dir -> 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
